<div class="share-buttons">
  <span class="share-label">Share:</span>
  <a class="share-button share-bluesky"
     href="https://bsky.app/intent/compose?text={{ page.title | uri_escape }}%20{{ site.url }}{{ page.url | uri_escape }}"
     target="_blank" rel="noopener noreferrer" aria-label="Share on Bluesky">
    <i class="fa-brands fa-bluesky" aria-hidden="true"></i> Bluesky
  </a>
  <a class="share-button share-linkedin"
     href="https://www.linkedin.com/shareArticle?mini=true&url={{ site.url }}{{ page.url | uri_escape }}&title={{ page.title | uri_escape }}"
     target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">
    <i class="fa-brands fa-linkedin" aria-hidden="true"></i> LinkedIn
  </a>
  <a class="share-button share-mastodon"
     href="https://mastodon.social/share?text={{ page.title | uri_escape }}%20{{ site.url }}{{ page.url | uri_escape }}"
     target="_blank" rel="noopener noreferrer" aria-label="Share on Mastodon">
    <i class="fa-brands fa-mastodon" aria-hidden="true"></i> Mastodon
  </a>
  <a class="share-button share-copy"
     href="{{ site.url }}{{ page.url }}"
     onclick="navigator.clipboard.writeText(this.href); this.textContent='Copied!'; setTimeout(() => this.innerHTML='<i class=\'fa fa-link\' aria-hidden=\'true\'></i> Copy Link', 1500); return false;"
     aria-label="Copy link to clipboard">
    <i class="fa fa-link" aria-hidden="true"></i> Copy Link
  </a>
</div>
