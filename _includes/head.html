<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- CSS -->
  <link rel="preload" href="{{ site.baseurl }}/public/css/main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="{{ site.baseurl }}/public/css/main.css"></noscript>

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ site.baseurl }}/public/apple-touch-icon-precomposed.png">
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">

  {% if site.mathjax %}
  <script type="text/javascript" async src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS_SVG"> </script>
  <script type="text/x-mathjax-config">
MathJax.Hub.Config({ tex2jax: { inlineMath: [ ['$','$'], ["\\(","\\)"] ], processEscapes: true } });
  </script>
  {% endif %}

  <!-- Mermaid diagram support -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose',
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true
        }
      });
      
      // Convert fenced code blocks with language-mermaid to mermaid diagrams
      document.querySelectorAll('pre code.language-mermaid').forEach(function(codeBlock) {
        var pre = codeBlock.parentElement;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeBlock.textContent;
        pre.parentElement.replaceChild(div, pre);
      });
      
      // Also handle cases where Rouge highlights it differently
      document.querySelectorAll('div.language-mermaid pre code, div.highlighter-rouge.language-mermaid pre code').forEach(function(codeBlock) {
        var wrapper = codeBlock.closest('.language-mermaid') || codeBlock.closest('.highlighter-rouge');
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeBlock.textContent;
        wrapper.parentElement.replaceChild(div, wrapper);
      });
      
      // Run mermaid after converting
      mermaid.run();
    });
  </script>
</head>
