# Site Info
title: "Caffeine, Code, & Chaos"
tagline: 'Systems engineer. Robotics geek. Maker of shiny things. Part race car, part glitter.</br> Powered by caffeine and curiosity.'
description: "Systems engineer, robotics geek, and maker of shiny things. Notes on DevOps, hardware, and whatever else catches my attention."
baseurl: ""
url: https://dxrf.com
logo: '/public/logo.png'

twitter:
  username: jmassardo

# Site configurations
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
excerpt_separator: "<!-- more -->"
sass:
  style: compressed
  sass_dir: _scss
paginate: 5
paginate_path: '/blog/page:num'
permalink: pretty

version: 2.0.0
exclude: [vendor]

# RSS feed
feed:
  posts_limit: 20

# Default OG image for social sharing (per-post image: frontmatter overrides this)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      image: /public/img/og-default.png

# About/contact
author:
  name: Jenna Massardo
  description: Systems engineer. Robotics geek. Maker of shiny things. Part race car, part glitter. Powered by caffeine and curiosity.
  gravatar: 69ea17ec24451281f083ff214479fb07 # md5 hash of your email address
  contact:
    linkedin:  https://www.linkedin.com/in/jenna-massardo/
    github:    https://github.com/jmassardo
    bluesky:   https://bsky.app/profile/jmassardo.bsky.social
    instagram: https://www.instagram.com/jennamassardo/
    #weibo:     http://weibo.com/41173780
    email:     mailto:jenna@dxrf.com

# Navigation (2nd level links supported)
nav:
  Home:
    - '/'
  Blog:
    - '/blog/'
    - { Categories: '/blog/categories/' }
    - { Tags: '/blog/tags/' }
  Resume:
    - '/resume/'
  Projects:
    - '/projects/'
  Reading List:
    - '/reading-list/'

# Where are tags and categories displayed
tag_page: '/blog/tags/'
category_page: '/blog/categories/'

hero:
  image: https://imgs.xkcd.com/comics/circuit_diagram.png
  imageurl: https://xkcd.com/730/
  caption: Welcome to my world! <br><small> Thanks <a href="https://xkcd.com/">XKCD</a> for another awesome comic</small>

# Plugins
mathjax: true # whether support mathjax
google_analytics_token: 'G-R8J4XTV6XW' # leave blank if you don't want google analytics
#disqus_short_name: '' # leave blank if you don't want disqus

# Giscus Comments (https://giscus.app)
giscus:
  enabled: true
  repo: "jmassardo/jmassardo.github.io"
  repo_id: "MDEwOlJlcG9zaXRvcnkxNTcxMzE0OTQ="           # Get from https://giscus.app
  category: "Comments"  # Create this category in Discussions
  category_id: "DIC_kwDOCV2i5s4C09dy"       # Get from https://giscus.app
  mapping: "pathname"   # Maps posts to discussions by URL path
  reactions: "1"        # Enable reactions
  input_position: "top" # Comment box at top
  theme: "noborder_light"
  lang: "en"
